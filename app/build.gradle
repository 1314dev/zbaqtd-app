apply plugin: 'com.android.application'

android {
    namespace 'com.example.zbaqtd'
    compileSdk 28

    defaultConfig {
        applicationId "com.example.zbaqtd"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 工程仅含 Java 源码，关闭 Kotlin/AIDL/RenderScript 等无关 task
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // 不引入任何 AndroidX / appcompat 依赖，保持零外部依赖，离线可编
}
