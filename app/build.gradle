apply plugin: "com.android.application"

android {
    namespace "com.example.zbaqtd"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.zbaqtd"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        resValues true
    }
}

dependencies {
    // 刻意保持零依赖：不引 appcompat / AndroidX 库，保证离线可编
}
